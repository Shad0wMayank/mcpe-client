name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q MCPEClient.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: MCPEClient
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MCPE-Client-apk
          path: MCPEClient/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp MCPEClient/app/build/outputs/apk/debug/app-debug.apk MCPE-Client.apk
          gh release create "build-${{ github.run_number }}" MCPE-Client.apk --title "MCPE Client build ${{ github.run_number }}" --notes "Download MCPE-Client.apk"
